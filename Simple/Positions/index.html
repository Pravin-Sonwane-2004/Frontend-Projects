<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
            .parrent {
                position: relative;   /* Makes this the anchor for the badge */
                width: 300px;
                height: 400px;
                border: 1px solid #0e0d0d;
                border-radius: 8px;
                overflow: hidden;     
                background-color: #301e1e;
            }
            .child {
                width: 60px;
                height: 60px;
                background-color: rgb(255, 115, 138);
                position: absolute;
                top: 50%;
                left: 50%;
               transform: translate(-50%, -50%);
                z-index: 1;
                text-align: center;
            }
        
    </style>
</head>
<body>
    <div class="parrent">
        <div class="child">
            SALE!
        </div>
    </div>

</body>
</html>
